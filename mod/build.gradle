plugins {
    // Minecraft 26.x не обфусцирован: "net.fabricmc.fabric-loom" без remap и без mappings.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mod Menu лежит в папке libs (необязательный, для кнопки настроек в списке модов).
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation files('libs/modmenu-21.0.0.jar')
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Standalone checks have their own source set; no JUnit or running server needed.
sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
// Run deterministic packet/pose regressions as part of every build.
tasks.register('regressionTest', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'ru.fpvdrone.server.ProtocolRegression'
}
tasks.named('check') { dependsOn 'regressionTest' }
