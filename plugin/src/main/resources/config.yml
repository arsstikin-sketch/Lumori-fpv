# Максимальная дальность дрона от игрока (блоков).
# Мод не даст улететь дальше, а сервер не покажет дрон, если он «оказался» дальше (защита от читов).
# 0 = игрок выбирает дальность от 8 до 512 блоков в настройках мода.
max-range: 0

# Размер модели ДРОНА (если skins.enabled: false). 1.0 = реальный 5" дрон (~30 см), это мелко; 1.5 — заметнее.
model-scale: 1.5

# Множитель дальности прорисовки модели (1.0 = стандарт для display-сущностей).
view-range: 2.0

# Упреждение, тиков: модель рисуется чуть впереди по ходу полёта, чтобы не отставать
# (игра сама сглаживает движение мобов ~3 тика). 0 — без упреждения. Если модель «убегает» вперёд — уменьшите.
prediction-ticks: 3

# Сглаживание движения модели дрона, тиков (1 — минимальная задержка, 2-3 — плавнее).
smoothing-ticks: 1

# Через сколько тиков без пакетов дрон пропадает (вылет игры, лаг). 20 тиков = 1 секунда.
timeout-ticks: 40

# Видит ли пилот свою модель:
#   hide-while-flying — пока управляешь (дрон армлен), своя модель не видна; дрон выключен и стоит/лежит
#                       дальше own-drone-show-distance от твоих глаз — виден (например, после клавиши V);
#   always-hide — никогда не показывать; always-show — всегда показывать.
own-drone: hide-while-flying
own-drone-show-distance: 2.0

# Писать в лог, если пакет дрона отклонён (слишком далеко от игрока).
log-rejected-packets: true

# Полная яркость модели — дрон хорошо видно ночью и в пещерах.
bright-model: true

# Обводка дрона цветом подсветки (видна сквозь стены, как от эффекта свечения).
glow-outline: false

# Полупрозрачный светящийся след за летящим дроном (цвет = цвет подсветки).
trail:
  enabled: true
  seconds: 3.0          # сколько секунд виден след
  width: 0.06           # толщина, блоков
  visible-to-pilot: true

# ---------------------------------------------------------------- Скины-мобы
skins:
  # true — вместо модели дрона летает выбранный моб (меню /flyskin). false — старая модель дрона.
  enabled: true
  # Ресурспаков больше нет: птицы — из голов и блоков, мобы — настоящие мобы. Всё видно без модов и без пака.
  # Скин тех, кто ещё не выбирал: <моб> или <моб>:<вариант> (см. /flyskin list).
  default: crow
  # Общий множитель размера мобов в полёте.
  size-multiplier: 1.0
  # Размер каждого моба в полёте — наибольшая сторона, в блоках.
  sizes:
    allay: 0.7
    bat: 0.6
    bee: 0.6
    blaze: 0.8
    ghast: 1.2
    happy_ghast: 1.2
    parrot: 0.6
    phantom: 1.2
    vex: 0.7
  # Если моб летит задом наперёд — поставьте 180.
  model-yaw-offset: 0
  # Сколько слоёв тёмного стекла за меню (0 — без затемнения, 4 — почти чёрный фон).
  menu-darkness: 2

# ---------------------------------------------------------------- Птицы (без модов и без ресурспака)
# 35 птиц и выдуманных существ из «голов» игроков со своим скином и блоков — не больше 13 сущностей на птицу.
# Видят все игроки без модов и без пака. В меню /flyskin они идут первыми.
birds:
  enabled: true
  # Размер в полёте = длина птицы в жизни × size-multiplier, но не меньше min-size и не больше max-size (блоков).
  size-multiplier: 2.0
  min-size: 0.6
  max-size: 2.5
  # Скины голов загружаются один раз через MineSkin (твой скин НЕ меняется). Бесплатный ключ: https://account.mineskin.org
  # Вписал ключ → перезапусти сервер: загрузка начнётся САМА и сама продолжится после перезапусков.
  mineskin-key: ""
  # Сколько скинов отправлять в минуту (бесплатный ключ — до 20; плагин сам подстраивается под ответ MineSkin).
  mineskin-per-minute: 18
  # true — недостающие головы догружаются сами при запуске; зависшая загрузка перезапускается через 3 минуты.
  auto-upload: true
  # true — после входа игрока (и после окончания загрузки) все скины голов заранее скачиваются ему в кэш игры
  # (крошечные невидимые головы перед глазами ~20 секунд). Потом птицы появляются сразу со скинами.
  preload-on-join: true
  # Подстройка головы-предмета (если головы оказались не того размера или повёрнуты):
  head-size: 0.5          # размер головы игрока при масштабе 1, блоков
  head-yaw: 0             # доворот, градусов (если «лицо» части смотрит назад — 180)
  head-offset-y: 0.0      # сдвиг вверх-вниз в долях головы
  head-transform: NONE    # как рисовать предмет: NONE, HEAD, FIXED
  # Плавность для остальных игроков (важнее точности):
  interpolation-ticks: 3  # за сколько тиков модель плавно доезжает до нового положения (1 — резко, 4-5 — очень мягко)
  smoothing: 10           # «пружина» на сервере: меньше — плавнее, но птица чуть отстаёт от дрона (6-20)
  max-flap-hz: 4          # взмахов в секунду не больше: сервер показывает 20 кадров/с, частые взмахи выглядят как дрожь

# Разрешённая стабилизация: Acro, Level или All. Применить: /drone reload.
stabilization:
  allowed: All

# Фиксированные настройки повреждений для всех пилотов.
# 0 = игрок выбирает сам. durability: 4 = неуничтожаемый дрон.
# liquids-destroy: client, true или false.
damage:
  durability: 0
  safe-contact: 0
  propeller-break: 0
  motor-break: 0
  frame-destroy: 0
  liquids-destroy: client
