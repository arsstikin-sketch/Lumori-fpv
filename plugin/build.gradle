plugins {
    id 'java'
}

group = 'ru.fpvdrone'
version = '0.9.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // API 26.1.2 работает и на сервере 26.3 (используются только стабильные методы).
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand 'version': project.version
    }
}

// Standalone checks have their own source set; no JUnit or running server needed.
sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
// Run deterministic packet/pose regressions as part of every build.
tasks.register('regressionTest', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'ru.fpvdrone.plugin.ProtocolRegression'
}
tasks.named('check') { dependsOn 'regressionTest' }


// Optional isolated-server smoke plugin (not included in the release JAR).
sourceSets {
    integration { compileClasspath += sourceSets.main.compileClasspath }
}
tasks.register('paperSmokeJar', Jar) {
    dependsOn integrationClasses
    archiveFileName = 'paper-smoke-test.jar'
    from sourceSets.integration.output
}

if (project.hasProperty('paperTestHome')) {
    sourceSets.integration.compileClasspath += files("${paperTestHome}/versions/26.3/paper-26.3.jar")
    sourceSets.integration.compileClasspath += fileTree("${paperTestHome}/libraries") { include '**/*.jar' }
}
